// Never renumber or reuse field numbers: old .jobtrack files must keep importing.
syntax = "proto3";

package jobtrack.v1;

message Backup {
  uint32 format_version = 1;
  string exported_at = 2;
  string exported_from = 3;

  repeated Company companies = 10;
  repeated Application applications = 11;
  repeated Interview interviews = 12;
  repeated FollowUp follow_ups = 13;
  repeated Activity activities = 14;
  Settings settings = 15;
}

message Company {
  string id = 1;
  string name = 2;
  string website = 3;
  string careers_url = 4;
  string notes = 5;
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_SAVED = 1;
  STAGE_APPLIED = 2;
  STAGE_SCREEN = 3;
  STAGE_INTERVIEWING = 4;
  STAGE_OFFER = 5;
  STAGE_CLOSED = 6;
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_REJECTED = 1;
  CLOSE_REASON_NO_REPLY = 2;
  CLOSE_REASON_WITHDREW = 3;
  CLOSE_REASON_DECLINED_OFFER = 4;
  CLOSE_REASON_ACCEPTED_OFFER = 5;
}

enum SalaryPeriod {
  SALARY_PERIOD_UNSPECIFIED = 0;
  SALARY_PERIOD_YEAR = 1;
  SALARY_PERIOD_MONTH = 2;
  SALARY_PERIOD_HOUR = 3;
}

message Salary {
  double min = 1;
  double max = 2;
  string currency = 3;
  SalaryPeriod period = 4;
  bool estimated = 5;
}

message Application {
  string id = 1;
  string company_id = 2;
  string role = 3;
  string url = 4;
  string job_id = 5;
  string source = 6;
  string location = 7;
  string work_mode = 8;
  Salary salary = 9;
  Stage stage = 10;
  CloseReason close_reason = 11;
  uint32 priority = 12;
  repeated string tags = 13;
  string notes = 14;
  string applied_at = 15;
  string replied_at = 16;
  string deadline = 17;
  string created_at = 18;
  string updated_at = 19;
  string archived_at = 20;
  string trashed_at = 21;
}

enum Round {
  ROUND_UNSPECIFIED = 0;
  ROUND_RECRUITER = 1;
  ROUND_TECHNICAL = 2;
  ROUND_CODING = 3;
  ROUND_SYSTEM_DESIGN = 4;
  ROUND_HIRING_MANAGER = 5;
  ROUND_HR = 6;
  ROUND_FINAL = 7;
  ROUND_OTHER = 8;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_WENT_WELL = 1;
  OUTCOME_NOT_SURE = 2;
  OUTCOME_WENT_BADLY = 3;
}

message Interview {
  string id = 1;
  string application_id = 2;
  string starts_at = 3;
  uint32 duration_minutes = 4;
  Round round = 5;
  string prep = 6;
  Outcome outcome = 7;
  string outcome_note = 8;
}

enum FollowUpKind {
  FOLLOW_UP_KIND_UNSPECIFIED = 0;
  FOLLOW_UP_KIND_AFTER_APPLY = 1;
  FOLLOW_UP_KIND_REPEAT = 2;
  FOLLOW_UP_KIND_AFTER_INTERVIEW = 3;
}

message FollowUp {
  string id = 1;
  string application_id = 2;
  string due_at = 3;
  FollowUpKind kind = 4;
  uint32 attempt = 5;
  string done_at = 6;
}

message Activity {
  string id = 1;
  string application_id = 2;
  string at = 3;
  string kind = 4;
  string text = 5;
}

message Settings {
  Stage default_stage = 1;
  string currency = 2;
  uint32 follow_up_days = 3;
  uint32 repeat_days = 4;
  uint32 max_tries = 5;
  string appearance = 6;
}
